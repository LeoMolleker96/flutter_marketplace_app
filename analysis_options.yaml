# Shared lint configuration for every package in the workspace.
#
# The analyzer does not inherit options from a parent directory, so each package
# has its own analysis_options.yaml that includes this one. Change a rule here
# and it applies everywhere.
#
# The `analyzer: exclude` block in each package's file is written by
# `flutter pub get` itself, not by hand.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
