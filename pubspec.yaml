name: marketplace_workspace
description: "Workspace root for the marketplace app. Holds the package list and the Melos configuration; contains no code of its own."
publish_to: none

environment:
  sdk: ^3.13.4

# One shared dependency resolution for every package below, and a single
# pubspec.lock at this level. A package listed here depends on another simply
# by naming it — no path: entries, no version bookkeeping while they live here.
workspace:
  - apps/marketplace_app
  - packages/design_system
  - packages/network
  - features/auth
  - features/listings

dev_dependencies:
  melos: ^8.9.0

# Run these with `fvm dart run melos run <script>`. Melos is a dev dependency of
# this workspace, not a global tool, so scripts use `exec` (which Melos runs
# itself in every matching package) instead of calling a `melos` binary.
melos:
  scripts:
    analyze:
      description: Analyze every package.
      exec:
        command: fvm flutter analyze
        concurrency: 4

    test:
      description: Run the tests of every package that has any.
      exec:
        command: fvm flutter test
        concurrency: 1
      packageFilters:
        dirExists: test

    format:
      description: Format the whole workspace.
      run: fvm dart format .

    codegen:
      description: Run build_runner in every package that depends on it.
      exec:
        command: fvm dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
